# Une image, deux contextes de deploiement, deux verdicts de build.
#
# Elle est scannee UNE SEULE FOIS : les deux jobs consomment le meme scan.json,
# octet pour octet, avec le meme seuil. Seul le fichier de contexte change.
name: demo

run-name: demo · ${{ inputs.provider }}/${{ inputs.model }} · batch ${{ inputs.batch-size }}

on:
  # Manuel seulement : chaque run appelle un LLM et coute de l'argent.
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [openai, anthropic]
        default: openai
      model:
        default: gpt-5.4-mini
      batch-size:
        description: CVE par requete LLM
        default: "10"

permissions:
  contents: read

env:
  SCAN_IMAGE: python:3.12-slim
  TRIVY_VERSION: v0.74.0
  VENS_VERSION: v0.5.0
  SBOM_SERIAL: urn:uuid:8a33e249-236a-487c-b5ed-cda48f58943c
  FAIL_ON: high
  # la CVE sur laquelle on s arrete pendant la demo
  FOCUS_CVE: CVE-2026-8376

jobs:
  scan:
    name: Scan (une seule fois)
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan ${{ env.SCAN_IMAGE }}
        run: trivy image --quiet --scanners vuln --format json --output scan.json "${SCAN_IMAGE}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scan
          path: scan.json
          retention-days: 30

  score:
    # Les deux jobs sont identiques. Seul `context.file` change.
    name: ${{ matrix.context.label }}
    needs: scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context:
          - { label: "Contexte exposé", file: contexts/internet-facing.yaml, slug: internet-facing }
          - { label: "Contexte interne", file: contexts/internal.yaml, slug: internal }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: scan

      - name: Score avec ${{ matrix.context.file }}
        id: vens
        uses: venslabs/vens-action@06d3eb97fb0c2040e95f3bea271d0aeb2fd00c76  # v0.2.0
        with:
          version: ${{ env.VENS_VERSION }}
          config-file: ${{ matrix.context.file }}
          input-report: scan.json
          input-format: trivy
          output-vex: vex-${{ matrix.context.slug }}.cdx.json
          output-enriched-report: enriched-${{ matrix.context.slug }}.json
          enrich: true
          attest: true
          sbom-serial-number: ${{ env.SBOM_SERIAL }}
          llm-provider: ${{ inputs.provider }}
          llm-model: ${{ inputs.model }}
          llm-batch-size: ${{ inputs.batch-size }}
          llm-api-key: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || secrets.OPENAI_API_KEY }}
          fail-on-severity: ${{ env.FAIL_ON }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: vens-${{ matrix.context.slug }}
          path: |
            vex-${{ matrix.context.slug }}.cdx.json
            enriched-${{ matrix.context.slug }}.json
            ${{ steps.vens.outputs.attestation-file }}
          retention-days: 30

  # Un seul tableau, deux colonnes : c'est ce qu'on lit a l'ecran pendant la demo.
  # Les deux jobs de scoring ecrivent chacun dans leur propre resume, donc la
  # comparaison ne peut se faire que dans un job qui voit les deux VEX.
  compare:
    name: Comparaison
    needs: score
    if: always()
    runs-on: ubuntu-latest
    steps:
      # sans ca, un run ou les deux jobs meurent avant l'upload fait echouer
      # l'etape ici, et le garde-fou plus bas n'a jamais la main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          pattern: vens-*

      - name: Tableau cote a cote
        run: |
          A=vens-internet-facing/vex-internet-facing.cdx.json
          B=vens-internal/vex-internal.cdx.json
          if [ ! -s "${A}" ] || [ ! -s "${B}" ]; then
            echo "VEX manquant, rien à comparer" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          n() {
            jq -r --arg s "$2" '[.vulnerabilities[].ratings[]
              | select(.method=="OWASP" and .severity==$s)] | length' "$1"
          }
          f() {
            jq -r --arg c "${FOCUS_CVE}" '[.vulnerabilities[] | select(.id==$c)
              | .ratings[] | select(.method=="OWASP")
              | "\(.severity) · \(.score)/81"][0] // "absente de ce run"' "$1"
          }
          {
            echo "## Même image, même scan, deux contextes · seuil \`${FAIL_ON}\`"
            echo
            echo "| sévérité OWASP | contexte exposé | contexte interne |"
            echo "|---|---:|---:|"
            for sev in critical high medium low info; do
              echo "| \`${sev}\` | $(n "${A}" "${sev}") | $(n "${B}" "${sev}") |"
            done
            echo
            echo "**${FOCUS_CVE}** · exposé : $(f "${A}") · interne : $(f "${B}")"
          } >> "${GITHUB_STEP_SUMMARY}"
