# A measurement bench: score an ARCHIVED scan with a chosen model, batch size, replicate
# count and vens revision, and keep the artefacts for 90 days.
#
# demo.yml scans the image first, so two of its runs are never comparable: the tag
# python:3.12-slim moves and the Trivy DB is rebuilt daily. This one skips the scan and
# reads a frozen scan.json out of runs/, so the only things that change between two runs
# are the ones you chose on the form. Everything else is held.
#
# What it is for, so far:
#   - the cross-model and run-to-run spread of venslabs/vens#310 step 5
#   - the magnitude of the batch-size defect, #327: dispatch at batch 1 and at batch 10
#   - checking a fix landed, once vens#336 lets a current Anthropic model run at all
#   - regression: did a prompt or code change move the scores, and by how much
#
# Two rules it exists to enforce. The scan is frozen, so the input never drifts. And the
# vens revision is recorded in provenance.json, because main moves — pass a commit sha in
# vens-ref to hold a whole campaign on one revision.
#
# No security gate here: a gate failure would kill the later replicates.
name: baseline

run-name: baseline · ${{ inputs.archived-run }} · ${{ inputs.provider }}/${{ inputs.model }} · batch ${{ inputs.batch-size }} · x${{ inputs.replicates }} · vens ${{ inputs.vens-ref }}

on:
  workflow_dispatch:
    inputs:
      archived-run:
        description: Folder under runs/ holding the frozen scan
        default: "2026-09-23"
      provider:
        type: choice
        options: [openai, anthropic]
        default: anthropic
      model:
        default: claude-sonnet-5
      batch-size:
        description: Keep this equal to the run you are comparing against — the score of a multi-component CVE depends on it (venslabs/vens#327)
        default: "10"
      replicates:
        description: Runs per context. The seed is not a reproducibility guarantee, so one run says nothing.
        default: "3"
      vens-ref:
        description: Branch or commit of venslabs/vens to build. Leave on main to take the tip; pass a commit sha to pin a whole measurement campaign to one revision.
        default: main

permissions:
  contents: read

env:
  # Build from main rather than pin a tag: v0.5.0 is dated 28/08/2026 and two output fixes
  # have been merged since without a release — #307 (keep a score of 0 in the VEX) and #324
  # (the Intrusion Detection sign). A pinned tag measures the pre-fix scoring path.
  # main moves, so pass a commit sha in vens-ref to hold a whole campaign on one revision.
  SBOM_SERIAL: urn:uuid:8a33e249-236a-487c-b5ed-cda48f58943c

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      replicates: ${{ steps.n.outputs.list }}
    steps:
      - id: n
        run: |
          n="${{ inputs.replicates }}"
          case "$n" in ''|*[!0-9]*) echo "::error::replicates must be a positive integer"; exit 1 ;; esac
          [ "$n" -ge 1 ] && [ "$n" -le 10 ] || { echo "::error::replicates must be between 1 and 10"; exit 1; }
          echo "list=$(seq 1 "$n" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  score:
    name: ${{ matrix.context.slug }} · run ${{ matrix.replicate }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        replicate: ${{ fromJSON(needs.plan.outputs.replicates) }}
        context:
          - { file: contexts/internet-facing.yaml, slug: internet-facing }
          - { file: contexts/internal.yaml, slug: internal }
          - { file: contexts/internal-api.yaml, slug: internal-api }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable

      - name: Build vens from ${{ inputs.vens-ref }}
        id: build
        env:
          REF: ${{ inputs.vens-ref }}
        run: |
          git clone --filter=blob:none https://github.com/venslabs/vens.git /tmp/vens
          git -C /tmp/vens checkout --detach "${REF}"
          sha=$(git -C /tmp/vens rev-parse HEAD)
          # vens-action puts bin-path's directory on PATH and calls `vens`, so the binary must be named vens.
          mkdir -p /tmp/vens-bin
          (cd /tmp/vens && go build -o /tmp/vens-bin/vens ./cmd/vens)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "built venslabs/vens \`${REF}\` at \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::vens built at ${sha}"

      - name: Use the frozen scan
        run: |
          src="runs/${{ inputs.archived-run }}/scan/scan.json"
          test -f "$src" || { echo "::error::$src not found — archive the run first"; exit 1; }
          cp "$src" scan.json
          python3 - <<'PY'
          import json, os
          d = json.load(open("scan.json"))
          digest = (d.get("Metadata", {}).get("RepoDigests") or [""])[0]
          rows = [v for r in d.get("Results", []) or [] for v in r.get("Vulnerabilities", []) or []]
          line = f"frozen scan: {d.get('ArtifactName')} @ {digest} — {len(rows)} rows, {len({v['VulnerabilityID'] for v in rows})} CVEs"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(line + "\n")
          PY

      - name: Score ${{ matrix.context.file }}
        # vens is called directly rather than through vens-action v0.2.0, which has no debug-dir
        # input: every call's prompts and response are archived (venslabs/vens#359, done in vens by #373).
        # vens reads the model from OPENAI_MODEL / ANTHROPIC_MODEL (pkg/llm/llm.go:106,110) and falls back
        # to its default when the variable is empty; the check below asserts the model it attested.
        # No severity gate: `vens generate` has no severity option and exits non-zero only on an error;
        # the gate lived in vens-action, which this job set to never fail (fail-on-severity: "").
        id: vens
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          BATCH: ${{ inputs.batch-size }}
          CONFIG: ${{ matrix.context.file }}
          SLUG: ${{ matrix.context.slug }}
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            openai) export OPENAI_MODEL="$MODEL" ;;
            anthropic) export ANTHROPIC_MODEL="$MODEL" ;;
          esac
          /tmp/vens-bin/vens generate --config-file "$CONFIG" --llm "$PROVIDER" --llm-batch-size "$BATCH" \
            --input-format trivy --sbom-serial-number "$SBOM_SERIAL" --sbom-version 1 --attest \
            --debug-dir calls scan.json "vex-$SLUG.cdx.json"
          /tmp/vens-bin/vens enrich --vex "vex-$SLUG.cdx.json" --output "enriched-$SLUG.json" scan.json

      - name: Check that every call's prompts and response are archived, from the dispatched model
        # The archive holds each call's system prompt, human prompt and response text, not the serialized
        # HTTP body: the body's other fields are fixed by the vens commit, the provider and the model.
        env:
          SLUG: ${{ matrix.context.slug }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os
          slug = os.environ["SLUG"]
          att = json.load(open(f"vex-{slug}.attestation.cdx.json"))
          ev = [{x["name"]: x["contents"]["attachment"]["content"] for x in e["data"]}
                for e in att["declarations"]["evidence"]]
          bad = sorted({(e["provider"], e["model"]) for e in ev} - {(os.environ["PROVIDER"], os.environ["MODEL"])})
          assert not bad, f"attested provider/model {bad}, dispatched {os.environ['PROVIDER']}/{os.environ['MODEL']}"
          want = [e["prompt_hash"] for e in ev]
          runs = glob.glob("calls/run-*")
          assert len(runs) == 1, f"expected one run folder under calls/, found {runs}"
          pairs = sorted(p[: -len(".system.prompt")] for p in glob.glob(runs[0] + "/batch-*.system.prompt"))
          missing = [os.path.basename(p) for p in pairs
                     if not os.path.exists(p + ".human.prompt") or not os.path.exists(p + ".response")]
          assert not missing, f"calls without their human prompt or response (a failed or truncated call): {missing}"
          got = [hashlib.sha256((open(p + ".system.prompt", encoding="utf-8").read() + "\n\n"
                                 + open(p + ".human.prompt", encoding="utf-8").read()).encode()).hexdigest()
                 for p in pairs]
          assert got == want, f"{len(got)} archived calls against {len(want)} attested calls, or a hash differs"
          print(f"{len(got)} calls by {os.environ['PROVIDER']}/{os.environ['MODEL']} archived: prompts and response "
                f"each, every prompt pair equal to its attested prompt_hash, in order")
          PY

      - name: Record what produced this
        run: |
          cat > provenance.json <<JSON
          {
            "archived_scan": "runs/${{ inputs.archived-run }}/scan/scan.json",
            "context": "${{ matrix.context.file }}",
            "replicate": ${{ matrix.replicate }},
            "provider": "${{ inputs.provider }}",
            "model": "${{ inputs.model }}",
            "llm_batch_size": ${{ inputs.batch-size }},
            "vens_ref": "${{ inputs.vens-ref }}",
            "vens_sha": "${{ steps.build.outputs.sha }}",
            "run_attempt": ${{ github.run_attempt }},
            "calls": "calls/run-*/batch-NNNNN.{system.prompt,human.prompt,response}",
            "run_id": ${{ github.run_id }},
            "head_sha": "${{ github.sha }}"
          }
          JSON
          cat provenance.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          # One artefact per attempt, so a failed attempt's files are kept beside its replacement's.
          name: baseline-${{ inputs.model }}-${{ matrix.context.slug }}-r${{ matrix.replicate }}-a${{ github.run_attempt }}
          path: |
            vex-${{ matrix.context.slug }}.cdx.json
            enriched-${{ matrix.context.slug }}.json
            provenance.json
            vex-${{ matrix.context.slug }}.attestation.cdx.json
            calls/
          retention-days: 90
