# A measurement bench: score an ARCHIVED scan with a chosen model, batch size, replicate
# count and vens revision, and keep the artefacts for 90 days.
#
# demo.yml scans the image first, so two of its runs are never comparable: the tag
# python:3.12-slim moves and the Trivy DB is rebuilt daily. This one skips the scan and
# reads a frozen scan.json out of runs/, so the only things that change between two runs
# are the ones you chose on the form. Everything else is held.
#
# What it is for, so far:
#   - the cross-model and run-to-run spread of venslabs/vens#310 step 5
#   - the magnitude of the batch-size defect, #327: dispatch at batch 1 and at batch 10
#   - checking a fix landed, once vens#336 lets a current Anthropic model run at all
#   - regression: did a prompt or code change move the scores, and by how much
#
# Two rules it exists to enforce. The scan is frozen, so the input never drifts. And the
# vens revision is recorded in provenance.json, because main moves — pass a commit sha in
# vens-ref to hold a whole campaign on one revision.
#
# No security gate here: a gate failure would kill the later replicates.
name: baseline

run-name: baseline · ${{ inputs.archived-run }} · ${{ inputs.provider }}/${{ inputs.model }} · batch ${{ inputs.batch-size }} · x${{ inputs.replicates }} · vens ${{ inputs.vens-ref }}${{ inputs.dispatch-id && format(' · dispatch {0}', inputs.dispatch-id) || '' }}

on:
  workflow_dispatch:
    inputs:
      archived-run:
        description: Folder under runs/ holding the frozen scan
        default: "2026-09-23"
      provider:
        description: mock is vens's own mock LLM, no key and nothing paid, to check this workflow on a runner; give it the model mock.
        type: choice
        options: [openai, anthropic, mock]
        default: anthropic
      model:
        default: claude-sonnet-5
      batch-size:
        description: Keep this equal to the run you are comparing against — the score of a multi-component CVE depends on it (venslabs/vens#327)
        default: "10"
      replicates:
        description: Runs per context. The seed is not a reproducibility guarantee, so one run says nothing.
        default: "3"
      vens-ref:
        description: Branch or commit of venslabs/vens to build. Leave on main to take the tip; pass a commit sha to pin a whole measurement campaign to one revision.
        default: main
      arm:
        description: The arm this run measures. It picks that arm's own API key, so each arm's spend shows apart in the provider's usage export. An ad hoc run counts in that arm's usage too, so keep it off campaign days.
        type: choice
        options: [before, after]
        required: true
      dispatch-id:
        description: Set by the campaign's dispatch script and put in the run's name, so the script finds the run it started. Leave empty by hand.
        default: ""

permissions:
  contents: read

env:
  # Build from main rather than pin a tag: v0.5.0 is dated 28/08/2026 and two output fixes
  # have been merged since without a release — #307 (keep a score of 0 in the VEX) and #324
  # (the Intrusion Detection sign). A pinned tag measures the pre-fix scoring path.
  # main moves, so pass a commit sha in vens-ref to hold a whole campaign on one revision.
  SBOM_SERIAL: urn:uuid:8a33e249-236a-487c-b5ed-cda48f58943c

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      replicates: ${{ steps.n.outputs.list }}
    steps:
      - id: n
        env:
          REPLICATES: ${{ inputs.replicates }}
          PROVIDER: ${{ inputs.provider }}
          ARM: ${{ inputs.arm }}
          DISPATCH_ID: ${{ inputs.dispatch-id }}
          # Whether each arm's key exists, not the key: a missing one stops the run before any job calls a model.
          OPENAI_BEFORE: ${{ secrets.OPENAI_API_KEY_BEFORE != '' }}
          OPENAI_AFTER: ${{ secrets.OPENAI_API_KEY_AFTER != '' }}
          ANTHROPIC_BEFORE: ${{ secrets.ANTHROPIC_API_KEY_BEFORE != '' }}
          ANTHROPIC_AFTER: ${{ secrets.ANTHROPIC_API_KEY_AFTER != '' }}
        run: |
          n="$REPLICATES"
          case "$n" in ''|*[!0-9]*) echo "::error::replicates must be a positive integer"; exit 1 ;; esac
          [ "$n" -ge 1 ] && [ "$n" -le 10 ] || { echo "::error::replicates must be between 1 and 10"; exit 1; }
          case "$ARM" in before|after) ;; *) echo "::error::arm must be before or after"; exit 1 ;; esac
          case "$DISPATCH_ID" in *[!A-Za-z0-9._-]*) echo "::error::dispatch-id takes letters, digits, '.', '_' and '-' only"; exit 1 ;; esac
          if [ "$PROVIDER" != mock ]; then
            has=$(echo "${PROVIDER}_${ARM}" | tr '[:lower:]' '[:upper:]')
            [ "${!has}" = true ] || { echo "::error::secret $(echo "${PROVIDER}_API_KEY_${ARM}" | tr '[:lower:]' '[:upper:]') is not set: each arm runs on its own key"; exit 1; }
          fi
          echo "list=$(seq 1 "$n" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  score:
    name: ${{ matrix.context.slug }} · run ${{ matrix.replicate }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        replicate: ${{ fromJSON(needs.plan.outputs.replicates) }}
        context:
          - { file: contexts/internet-facing.yaml, slug: internet-facing }
          - { file: contexts/internal.yaml, slug: internal }
          - { file: contexts/internal-api.yaml, slug: internal-api }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable

      - name: Build vens from ${{ inputs.vens-ref }}
        id: build
        env:
          REF: ${{ inputs.vens-ref }}
        run: |
          git clone --filter=blob:none https://github.com/venslabs/vens.git /tmp/vens
          git -C /tmp/vens checkout --detach "${REF}"
          sha=$(git -C /tmp/vens rev-parse HEAD)
          # vens-action puts bin-path's directory on PATH and calls `vens`, so the binary must be named vens.
          mkdir -p /tmp/vens-bin
          (cd /tmp/vens && go build -o /tmp/vens-bin/vens ./cmd/vens)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "built venslabs/vens \`${REF}\` at \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::vens built at ${sha}"

      - name: Use the frozen scan
        env:
          ARCHIVED_RUN: ${{ inputs.archived-run }}
        run: |
          src="runs/$ARCHIVED_RUN/scan/scan.json"
          test -f "$src" || { echo "::error::$src not found — archive the run first"; exit 1; }
          cp "$src" scan.json
          python3 - <<'PY'
          import json, os
          d = json.load(open("scan.json"))
          digest = (d.get("Metadata", {}).get("RepoDigests") or [""])[0]
          rows = [v for r in d.get("Results", []) or [] for v in r.get("Vulnerabilities", []) or []]
          line = f"frozen scan: {d.get('ArtifactName')} @ {digest} — {len(rows)} rows, {len({v['VulnerabilityID'] for v in rows})} CVEs"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(line + "\n")
          PY

      - name: Score ${{ matrix.context.file }}
        # vens is called directly rather than through vens-action v0.2.0, which has no debug-dir
        # input: every call's prompts and response are archived (venslabs/vens#359, done in vens by #373).
        # vens reads the model from OPENAI_MODEL / ANTHROPIC_MODEL (pkg/llm/llm.go:106,110) and falls back
        # to its default when the variable is empty; the check below asserts the model it attested.
        # No severity gate: `vens generate` has no severity option and exits non-zero only on an error;
        # the gate lived in vens-action, which this job set to never fail (fail-on-severity: "").
        # attempt.json is written first and completed as each command ends, so a stop before `vens generate`
        # keeps its cause, a failed attempt its exit status and an interrupted one its start with none, the job's
        # conclusion then saying why it stopped. vens's stderr, the arm's key stripped from it, also goes to
        # vens-<slug>.log, so each attempt's cause and run summary travel with its artefact (venslabs/vens#310).
        id: vens
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          BATCH: ${{ inputs.batch-size }}
          CONFIG: ${{ matrix.context.file }}
          SLUG: ${{ matrix.context.slug }}
          REPLICATE: ${{ matrix.replicate }}
          ARM: ${{ inputs.arm }}
          VENS: /tmp/vens-bin/vens
          VENS_REF: ${{ inputs.vens-ref }}
          VENS_SHA: ${{ steps.build.outputs.sha }}
          ARCHIVED_SCAN: runs/${{ inputs.archived-run }}/scan/scan.json
          # The arm's own key, never the shared OPENAI_API_KEY / ANTHROPIC_API_KEY.
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && (inputs.arm == 'before' && secrets.OPENAI_API_KEY_BEFORE || inputs.arm == 'after' && secrets.OPENAI_API_KEY_AFTER) || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && (inputs.arm == 'before' && secrets.ANTHROPIC_API_KEY_BEFORE || inputs.arm == 'after' && secrets.ANTHROPIC_API_KEY_AFTER) || '' }}
        run: |
          set -euo pipefail
          now() { date -u +%Y-%m-%dT%H:%M:%SZ; }
          # Rewritten whole, so a kill mid-write leaves the record as it was.
          record() { jq "$@" attempt.json > attempt.json.tmp && mv attempt.json.tmp attempt.json; }
          stop() { record --arg e "$1" '.setup_error = $e'; echo "::error::$1"; exit 1; }

          binary=$(sha256sum "$VENS" | cut -d' ' -f1)
          jq -n --arg arm "$ARM" --arg provider "$PROVIDER" --arg model "$MODEL" --arg batch "$BATCH" \
            --arg ref "$VENS_REF" --arg sha "$VENS_SHA" --arg binary "$binary" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$SLUG · run $REPLICATE" --arg context "$SLUG" --argjson replicate "$REPLICATE" \
            --arg scan "$ARCHIVED_SCAN" --arg config "$CONFIG" \
            '{record: 1, runner: "baseline.yml", arm: $arm, provider: $provider, model: $model,
              llm_batch_size: ($batch | tonumber? // $batch), vens_ref: $ref, vens_sha: $sha,
              vens_binary_sha256: $binary, run_id: $run_id, run_attempt: $run_attempt, job: $job,
              context: $context, replicate: $replicate, archived_scan: $scan, config: $config, setup_error: null,
              generate: {started_at: null, ended_at: null, exit_status: null, log_complete: null},
              enrich: null, archive_check: null, provenance: null}' > attempt.json.tmp
          mv attempt.json.tmp attempt.json

          case "$PROVIDER" in
            openai) export OPENAI_MODEL="$MODEL"; key="$OPENAI_API_KEY" ;;
            anthropic) export ANTHROPIC_MODEL="$MODEL"; key="$ANTHROPIC_API_KEY" ;;
            *) key="" ;;
          esac
          if [ "$PROVIDER" != mock ] && [ -z "$key" ]; then
            stop "secret $(echo "${PROVIDER}_API_KEY_${ARM}" | tr '[:lower:]' '[:upper:]') is not set: each arm runs on its own key"
          fi
          case "$BATCH" in ''|*[!0-9]*) stop "batch-size must be a positive integer" ;; esac
          [ "$BATCH" -ge 1 ] || stop "batch-size must be a positive integer"

          # The arm's key is cut out of vens's stderr before anything stores it: GitHub masks the job log, not
          # the artefact.
          redact='import os, sys
          key = os.environ["KEY"].encode()
          for line in sys.stdin.buffer:
              sys.stdout.buffer.write(line.replace(key, b"***") if key else line)
              sys.stdout.buffer.flush()'
          record --arg t "$(now)" '.generate.started_at = $t'
          exec 3>&1
          set +e
          "$VENS" generate --config-file "$CONFIG" --llm "$PROVIDER" --llm-batch-size "$BATCH" \
            --input-format trivy --sbom-serial-number "$SBOM_SERIAL" --sbom-version 1 --attest \
            --debug-dir calls scan.json "vex-$SLUG.cdx.json" 2>&1 1>&3 \
            | KEY="$key" python3 -c "$redact" | tee "vens-$SLUG.log" >&2
          statuses=("${PIPESTATUS[@]}")
          set -e
          status=${statuses[0]}
          # The log is whole only if the redaction and tee both ended cleanly; the archive check requires it.
          if [ "${statuses[1]}" -eq 0 ] && [ "${statuses[2]}" -eq 0 ]; then log=true; else log=false; fi
          # If this write fails the step stops here, no exit status recorded: the attempt fails closed.
          record --arg t "$(now)" --argjson s "$status" --argjson log "$log" \
            '.generate += {ended_at: $t, exit_status: $s, log_complete: $log}'
          [ "$status" -eq 0 ] || exit "$status"

          record --arg t "$(now)" '.enrich = {started_at: $t, ended_at: null, exit_status: null}'
          set +e
          "$VENS" enrich --vex "vex-$SLUG.cdx.json" --output "enriched-$SLUG.json" scan.json
          status=$?
          set -e
          record --arg t "$(now)" --argjson s "$status" '.enrich += {ended_at: $t, exit_status: $s}'
          exit "$status"

      - name: Check that every call's prompts and response are archived, from the dispatched model
        # The archive holds each call's system prompt, human prompt and response text, not the serialized
        # HTTP body: the body's other fields are fixed by the vens commit, the provider and the model.
        id: check
        env:
          SLUG: ${{ matrix.context.slug }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, os
          slug = os.environ["SLUG"]
          rec = json.load(open("attempt.json"))
          assert rec["generate"].get("log_complete") is True and os.path.isfile(f"vens-{slug}.log"), \
              "vens's log was not captured whole: its redaction or tee failed"
          att = json.load(open(f"vex-{slug}.attestation.cdx.json"))
          ev = [{x["name"]: x["contents"]["attachment"]["content"] for x in e["data"]}
                for e in att["declarations"]["evidence"]]
          bad = sorted({(e["provider"], e["model"]) for e in ev} - {(os.environ["PROVIDER"], os.environ["MODEL"])})
          assert not bad, f"attested provider/model {bad}, dispatched {os.environ['PROVIDER']}/{os.environ['MODEL']}"
          want = [e["prompt_hash"] for e in ev]
          runs = glob.glob("calls/run-*")
          assert len(runs) == 1, f"expected one run folder under calls/, found {runs}"
          pairs = sorted(p[: -len(".system.prompt")] for p in glob.glob(runs[0] + "/batch-*.system.prompt"))
          missing = [os.path.basename(p) for p in pairs
                     if not os.path.exists(p + ".human.prompt") or not os.path.exists(p + ".response")]
          assert not missing, f"calls without their human prompt or response (a failed or truncated call): {missing}"
          got = [hashlib.sha256((open(p + ".system.prompt", encoding="utf-8").read() + "\n\n"
                                 + open(p + ".human.prompt", encoding="utf-8").read()).encode()).hexdigest()
                 for p in pairs]
          assert got == want, f"{len(got)} archived calls against {len(want)} attested calls, or a hash differs"
          print(f"{len(got)} calls by {os.environ['PROVIDER']}/{os.environ['MODEL']} archived: prompts and response "
                f"each, every prompt pair equal to its attested prompt_hash, in order")
          PY

      - name: Record what produced this
        env:
          ARCHIVED_RUN: ${{ inputs.archived-run }}
          CONFIG: ${{ matrix.context.file }}
          REPLICATE: ${{ matrix.replicate }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          BATCH: ${{ inputs.batch-size }}
          VENS_REF: ${{ inputs.vens-ref }}
          VENS_SHA: ${{ steps.build.outputs.sha }}
        run: |
          jq -n --arg scan "runs/$ARCHIVED_RUN/scan/scan.json" --arg context "$CONFIG" \
            --argjson replicate "$REPLICATE" --arg provider "$PROVIDER" --arg model "$MODEL" \
            --argjson batch "$BATCH" --arg ref "$VENS_REF" --arg sha "$VENS_SHA" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --argjson run_id "$GITHUB_RUN_ID" --arg head "$GITHUB_SHA" \
            '{archived_scan: $scan, context: $context, replicate: $replicate, provider: $provider, model: $model,
              llm_batch_size: $batch, vens_ref: $ref, vens_sha: $sha, run_attempt: $run_attempt,
              calls: "calls/run-*/batch-NNNNN.{system.prompt,human.prompt,response}", run_id: $run_id,
              head_sha: $head}' > provenance.json
          cat provenance.json

      - name: Complete the attempt record
        # Runs whatever ended the steps before, the cancel included: a step that did not run is recorded skipped.
        if: always()
        env:
          ARCHIVE_CHECK: ${{ steps.check.outcome }}
        run: |
          [ -f attempt.json ] || exit 0
          if [ -f provenance.json ]; then provenance=true; else provenance=false; fi
          jq --arg check "$ARCHIVE_CHECK" --argjson provenance "$provenance" \
            '.archive_check = $check | .provenance = $provenance' attempt.json > attempt.json.tmp
          mv attempt.json.tmp attempt.json
          cat attempt.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          # One artefact per attempt, so a failed attempt's files are kept beside its replacement's.
          name: baseline-${{ inputs.model }}-${{ matrix.context.slug }}-r${{ matrix.replicate }}-a${{ github.run_attempt }}
          path: |
            attempt.json
            vens-${{ matrix.context.slug }}.log
            vex-${{ matrix.context.slug }}.cdx.json
            enriched-${{ matrix.context.slug }}.json
            provenance.json
            vex-${{ matrix.context.slug }}.attestation.cdx.json
            calls/
          retention-days: 90
