name: cache-test

# One run of the Anthropic prompt-cache test (venslabs/vens#310, PR 7's cache
# part): does a cache read survive a change of response schema? See
# cache-test/main.go.
on:
  push:
    branches: [cache-test-1711]

permissions:
  contents: read

jobs:
  cache-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: cache-test/go.mod
          cache: false
      - name: Run the cache test
        working-directory: cache-test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: go run . -data data -out results.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: cache-test-results
          path: cache-test/results.jsonl
